services:

  cloudmon-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudmon-api

    ports:
      - "8001:8000"

    env_file:
      - .env

    restart: unless-stopped

    mem_limit: 220m
    cpus: "0.50"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  postgres:
    image: postgres:18

    container_name: cloudmon-postgres

    environment:
      POSTGRES_DB: cloudmon
      POSTGRES_USER: cloudmon_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - cloudmon_postgres_data:/var/lib/postgresql

    restart: unless-stopped

    mem_limit: 180m
    cpus: "0.40"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cloudmon_user -d cloudmon"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  cloudmon_postgres_data:
