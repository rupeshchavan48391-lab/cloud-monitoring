services:

  cloudmon-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudmon-api

    env_file:
      - .env

    ports:
      - "8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    mem_limit: 220m
    cpus: "0.50"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  postgres:
    image: postgres:18

    container_name: cloudmon-postgres

    environment:
      POSTGRES_DB: cloudmon
      POSTGRES_USER: cloudmon_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - cloudmon_postgres_data:/var/lib/postgresql

    restart: unless-stopped

    mem_limit: 180m
    cpus: "0.40"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cloudmon_user -d cloudmon"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s


  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: cloudmon-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
      - "--web.listen-address=0.0.0.0:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - cloudmon-api

    restart: unless-stopped

    mem_limit: 120m
    cpus: "0.25"


  grafana:
    image: grafana/grafana:12.1.0

    container_name: cloudmon-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped

    mem_limit: 160m
    cpus: "0.25"


  nginx:
    image: nginx:alpine

    container_name: cloudmon-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - cloudmon-api

    restart: unless-stopped

    mem_limit: 40m
    cpus: "0.10"


volumes:

  cloudmon_postgres_data:

  prometheus_data:

  grafana_data:
